# Development services. Run the app itself on the host:
#   USE_POSTGRES=1 REDIS_URL=redis://localhost:6379/0 python manage.py runserver
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: island
      POSTGRES_USER: island
      POSTGRES_PASSWORD: island
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
