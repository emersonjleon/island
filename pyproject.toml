[project]
name = "ages-of-the-island"
version = "0.1.0"
description = "Real-time Catan-style strategy game"
requires-python = ">=3.12"
dependencies = [
    "pydantic~=2.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["engine"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
include = ["engine*"]
