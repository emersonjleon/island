name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install "pydantic~=2.12" "pytest>=8"
      - name: Engine tests
        run: python -m pytest -q

  django:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y gettext
          python -m pip install -e .
      - name: Compile translations
        run: python manage.py compilemessages
      - name: Check
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test common accounts lobby gamehost gameplay

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # Two browsers play a short game against the real web server, game host and Redis.
    runs-on: ubuntu-latest
    needs: [django, frontend]
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install -e .
          (cd frontend && npm ci && npm run build)
          (cd e2e && npm ci && npx playwright install --with-deps chromium)
      - name: Two-player game
        run: python e2e/run.py --out e2e/out
      - name: Keep screenshots and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e/out
