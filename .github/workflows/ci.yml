name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install "pydantic~=2.12" "pytest>=8"
      - name: Engine tests
        run: python -m pytest -q

  django:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y gettext
          python -m pip install -e .
      - name: Compile translations
        run: python manage.py compilemessages
      - name: Translations complete and up to date
        run: |
          cp locale/es/LC_MESSAGES/django.po "$RUNNER_TEMP/committed.po"
          python manage.py makemessages -l es --no-obsolete --ignore 'frontend/*' --ignore 'static/*'
          python scripts/i18n_check.py --committed "$RUNNER_TEMP/committed.po"
          git checkout -- locale
          python -m unittest scripts/test_i18n_check.py
      - name: Check
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test common accounts lobby gamehost gameplay

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
